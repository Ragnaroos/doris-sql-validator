interface:
  display_name: "SQLGlot 修复与回归验证"
  short_description: "按选定任务或整份输入持续修复 SQLGlot，跨轮复用 task，获授权后独立提交到 fork"
  default_prompt: "使用 $pg-doris-fix，请按我明确选择的指定任务或整份输入模式持续修复，复用/重新打开/新增 task 并完成回归；仅按本次明确的 fork、分支及 commit/push 授权保存代码，不创建社区 Issue/PR，一轮完成不等于整份输入完成。"
policy:
  allow_implicit_invocation: false
