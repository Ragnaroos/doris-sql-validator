name: doris-sql-validator-postgres

services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: dsv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsv_validation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-validation-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsv_validation"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-validation-data:
