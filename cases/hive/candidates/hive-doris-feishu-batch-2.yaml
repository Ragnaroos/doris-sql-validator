- id: feishu-008
  statement_index: 8
  sql: |-
    SELECT sum(
      CASE
        WHEN TRUE THEN CAST(1.25 AS DECIMAL(10, 2))
        ELSE CAST(0 AS STRING)
      END
    ) AS value
- id: feishu-009
  statement_index: 9
  sql: |-
    SELECT get_json_object(conversion, '$.conversionBehaviorId') AS behavior_id
    FROM (
      SELECT conversion
      FROM (
        SELECT '[{"conversionBehaviorId":"6"},{"conversionBehaviorId":"7"}]' AS conversions
      ) s
      LATERAL VIEW explode(
        split(
          regexp_replace(
            substring(conversions, 2, length(conversions) - 2),
            '\\},\\{',
            '\\}|\\{'
          ),
          '\\|'
        )
      ) tmp AS conversion
    ) t
    WHERE get_json_object(conversion, '$.conversionBehaviorId') = '6'
